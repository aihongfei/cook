# pnpm 12 的依赖构建许可走 allowBuilds 映射（与 apps/mobile/pnpm-workspace.yaml 一致）；
# 旧的 onlyBuiltDependencies / ignoredBuiltDependencies 在 pnpm 12 下不被读取，会报 ERR_PNPM_IGNORED_BUILDS。
#
# Prisma 需要执行 postinstall 来准备引擎，因此显式放行；
# 其余一律拒绝：@scarf/scarf 只是遥测上报；protobufjs 的 postinstall 只是打印捐赠提示；
# @google/genai 是 pi-ai 的传递依赖（本项目只用它的 openai-completions 适配器，不用 google 那一支），
# 它们的脚本都不参与运行，明确拒绝以免安装链被安全策略打断。
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@scarf/scarf': false
  protobufjs: false
  '@google/genai': false
