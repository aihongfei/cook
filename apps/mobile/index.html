<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标：从品牌母图产出（scripts/build-brand-assets.sh）。
         只出位图不出 SVG：这一版母图是细节较多的场景插画，手描不现实、
         自动描摹对水彩笔触效果差，而 favicon 实际就渲染在 16~32px，
         位图在这个尺寸反而更干净 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FCF1DA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>御膳私房菜</title>
    <link
      rel="preload"
      href="/fonts/zcool-kuaile-chinese-simplified-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
