apply plugin: 'com.android.application'

/*
 * release 签名（F14-01）。
 *
 * 密钥与密码**都不在这个仓库里**（约定见 android/.gitignore 与 RUNBOOK）：
 * keystore 在 android/keystore/（已忽略），四个参数写在仓库外的
 * `~/.gradle/gradle.properties`。这样做的原因：
 * - 丢了签名就不能再给已装机的 App 发更新（Android 认签名不认人），它该进密码管理器；
 * - 仓库有可能被分享/克隆，密钥一旦进去就洗不干净了。
 *
 * 没配齐时**跳过** release 签名而不是报错：别人克隆下来仍能 `assembleDebug`，
 * 而要出 release 包时会明确停在"缺哪一个属性"上（见下面那条错误信息）。
 */
def releaseKeystoreFile = project.findProperty('YUSHAN_KEYSTORE_FILE')
def releaseKeystorePassword = project.findProperty('YUSHAN_KEYSTORE_PASSWORD')
def releaseKeyAlias = project.findProperty('YUSHAN_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('YUSHAN_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.yushan.cook"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yushan.cook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// 出 release 包时签名缺失要在**开始构建前**说清楚，而不是等打包到最后一步才报个看不懂的错
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name.toLowerCase().contains('release') && it.name.toLowerCase().contains('assemble') }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(
            "缺少 release 签名配置（YUSHAN_KEYSTORE_FILE / YUSHAN_KEYSTORE_PASSWORD / " +
            "YUSHAN_KEY_ALIAS / YUSHAN_KEY_PASSWORD）。\n" +
            "它们应写在仓库外的 ~/.gradle/gradle.properties，keystore 放 android/keystore/（都不入库）。\n" +
            "首次生成的做法见 RUNBOOK 的打包一节。"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
		// @capacitor/background-runner 的 postinstall 自己插进来的（那个原生 JS 引擎的 AAR）。
		// ⚠️ 这行的缩进是**制表符**、与文件其余部分不一致，但**别去"整理"它**：
		// postinstall 靠精确匹配这串文本判断"插过了没有"，改了它下次装依赖会插第二份。
		dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    /*
     * OkHttp（F10-08）：原生那条实时连接用它挂 WebSocket（`RealtimeService`）。
     *
     * 为什么要自己引一个：Capacitor 的 Android 库**没有**传递依赖 OkHttp（它走 WebView 的请求栈），
     * 实测整个依赖图里确实没有它。版本定 4.12.0：与这里的 AndroidX/Java 版本兼容，
     * 且它的 `pingInterval` 正好是长连接保活要的那个开关（不靠读超时保活）。
     */
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
